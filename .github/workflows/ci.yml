name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate skill paths
        run: |
          python - <<'EOF'
          import json, sys
          from pathlib import Path

          manifest = json.loads(Path(".claude-plugin/marketplace.json").read_text())
          errors = []
          for plugin in manifest.get("plugins", []):
              for skill_path in plugin.get("skills", []):
                  skill_md = Path(skill_path.lstrip("./")) / "SKILL.md"
                  if not skill_md.exists():
                      errors.append(f"Missing SKILL.md: {skill_md}")
          if errors:
              for e in errors:
                  print(e)
              sys.exit(1)
          total = sum(len(p.get("skills", [])) for p in manifest.get("plugins", []))
          print(f"OK — {total} skills validated")
          EOF

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pre-commit hooks (prek)
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          extra-args: --all-files --skip prose-lint
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Test Python
        run: uv run --no-project --with pytest pytest -p no:cacheprovider audit/walkthrough/scripts/
